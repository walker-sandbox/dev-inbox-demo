name: Demo PR
on:
  workflow_dispatch:
    inputs:
      pr:
        description: Existing pull request number to request review on
        default: "1"
      reviewer:
        description: GitHub login to request review from and mention
        default: WNZhao
permissions:
  pull-requests: write
  issues: write
jobs:
  request-review:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Request review and mention reviewer
        run: |
          gh pr edit "${{ inputs.pr }}" --add-reviewer "${{ inputs.reviewer }}" || echo "review request failed (non-fatal)"
          gh pr comment "${{ inputs.pr }}" --body "@${{ inputs.reviewer }} could you take a look when you have a minute? This dependency bump unblocks the security alert on main."
